# Disaster Recovery Configuration
forage.dr.enabled=true
forage.dr.storage.backend=jdbc
forage.dr.checkpoint.enabled=true
forage.dr.shutdown.persistence=true
forage.dr.replay.on.startup=true
forage.dr.ai.state.check.enabled=true
forage.dr.snapshot.ttl.seconds=86400
forage.dr.schema.auto.create=true
forage.dr.jdbc.datasource.name=dataSource
